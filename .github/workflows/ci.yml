name: OpenNear CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-opennear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Cortex-M bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build & Run Core 41-Suite Automated Test Bench
        run: |
          mkdir -p build
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Icore/include -Ihal -Isim \
            core/src/on_frame.c core/src/on_polar.c core/src/on_sync.c \
            core/src/on_superframe.c core/src/on_sec.c core/src/on_ecdh.c core/src/on_afh.c \
            core/src/on_amc.c core/src/on_sar.c core/src/on_ranging.c \
            core/src/on_ota.c core/src/on_gateway.c core/src/on_mesh.c core/src/on_mqtt.c \
            core/src/on_locate.c core/src/on_node.c \
            sim/sim_world.c tests/test_opennear.c -lm -o build/test_opennear
          ./build/test_opennear

      - name: Build & Run 10-Node Multi-Hop Lifecycle Simulator
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Icore/include -Ihal -Isim \
            core/src/on_frame.c core/src/on_polar.c core/src/on_sync.c \
            core/src/on_superframe.c core/src/on_sec.c core/src/on_ecdh.c core/src/on_afh.c \
            core/src/on_amc.c core/src/on_sar.c core/src/on_ranging.c \
            core/src/on_ota.c core/src/on_gateway.c core/src/on_mesh.c core/src/on_mqtt.c \
            core/src/on_locate.c core/src/on_node.c \
            sim/sim_world.c sim/main_sim.c -lm -o build/opennear_sim
          (cd build && ./opennear_sim)

      - name: Build & Run Route B L1 PHY Benchmark
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Icore/include \
            core/src/on_frame.c core/src/on_polar.c core/src/on_amc.c \
            ports/sdr_fpga_ref/l1_phy_bench.c -lm -o build/l1_phy_bench
          ./build/l1_phy_bench

      - name: Cross-Compile Route A Nordic nRF52840 Bare-Metal Firmware (.elf & .hex)
        run: |
          make -C ports/nrf52840_bare MASTER=0
          make -C ports/nrf52840_bare clean
          make -C ports/nrf52840_bare MASTER=1

      - name: Run Python Real-Hardware Log Analyzer & GPIO Sync Unit Tests
        run: |
          python3 -m unittest -v tests/test_analyze_esp32_hw_log.py tests/test_measure_esp32_gpio_sync.py

  build-esp32-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-esp32-${{ hashFiles('ports/esp32_wroom32/platformio.ini') }}

      - name: Install PlatformIO CLI
        run: pip install -U platformio

      - name: Link & Verify ESP32 Gateway (Plain + MQTTS/TLS), Demo Sync & OTA Terminal Firmwares
        run: |
          pio run -d ports/esp32_wroom32 -e esp32_iot_mesh_gw -e esp32_iot_mesh_gw_tls -e esp32_demo_sync_node -e esp32_node_t_ota
