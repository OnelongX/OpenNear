[env:esp32_node_t]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../../core/include
    -I../../hal
    -Iinclude
    -DOPENNEAR_IS_MASTER=0
    -DOPENNEAR_CAPS=0x03
lib_extra_dirs =
build_src_filter =
    +<*>
    +<../../../core/src/on_frame.c>
    +<../../../core/src/on_sync.c>
    +<../../../core/src/on_superframe.c>
    +<../../../core/src/on_sec.c>
    +<../../../core/src/on_afh.c>
    +<../../../core/src/on_amc.c>
    +<../../../core/src/on_sar.c>
    +<../../../core/src/on_node.c>

[env:esp32_node_g]
extends = env:esp32_node_t
build_flags =
    -I../../core/include
    -I../../hal
    -Iinclude
    -DOPENNEAR_IS_MASTER=1
    -DOPENNEAR_CAPS=0x00
