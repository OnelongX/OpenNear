[env:esp32_node_t]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../../core/include
    -I../../hal
    -Iinclude
    -DOPENNEAR_IS_MASTER=0
    -DOPENNEAR_CAPS=0x03
lib_extra_dirs =
build_src_filter =
    +<*>
    +<../../../core/src/on_frame.c>
    +<../../../core/src/on_sync.c>
    +<../../../core/src/on_superframe.c>
    +<../../../core/src/on_sec.c>
    +<../../../core/src/on_ecdh.c>
    +<../../../core/src/on_afh.c>
    +<../../../core/src/on_amc.c>
    +<../../../core/src/on_sar.c>
    +<../../../core/src/on_ota.c>
    +<../../../core/src/on_gateway.c>
    +<../../../core/src/on_mesh.c>
    +<../../../core/src/on_mqtt.c>
    +<../../../core/src/on_node.c>

[env:esp32_node_g]
extends = env:esp32_node_t
build_flags =
    -I../../core/include
    -I../../hal
    -Iinclude
    -DOPENNEAR_IS_MASTER=1
    -DOPENNEAR_CAPS=0x00

[env:esp32_node_g_capture]
extends = env:esp32_node_g
build_flags =
    ${env:esp32_node_g.build_flags}
    -DOPENNEAR_ACT_CAPTURE=1

[env:esp32_node_g_trace]
extends = env:esp32_node_g_capture
build_flags =
    ${env:esp32_node_g_capture.build_flags}
    -DOPENNEAR_ACT_TRACE=1

[env:esp32_node_t_trace]
extends = env:esp32_node_t
build_flags =
    ${env:esp32_node_t.build_flags}
    -DOPENNEAR_ACT_TRACE=1

[env:esp32_node_g_lookahead]
extends = env:esp32_node_g_trace
build_flags =
    ${env:esp32_node_g_trace.build_flags}
    -DOPENNEAR_ACT_LOOKAHEAD=1

[env:esp32_node_t_lookahead]
extends = env:esp32_node_t_trace
build_flags =
    ${env:esp32_node_t_trace.build_flags}
    -DOPENNEAR_ACT_LOOKAHEAD=1

; v5.0 Primary G Public Wi-Fi STA + BLE GATT Gateway + Cluster OTA Coordinator
[env:esp32_gw_wifi_ble]
extends = env:esp32_node_g
board_build.partitions = min_spiffs.csv
build_flags =
    ${env:esp32_node_g.build_flags}
    -DOPENNEAR_ENABLE_OTA=1
    -DOPENNEAR_ENABLE_WIFI_GW=1
    -DOPENNEAR_ENABLE_BLE_GW=1
    -DOPENNEAR_FW_VERSION=0x00050000u

; v5.0 OTA-Enabled Terminal / Sub-G Node (with A/B Partition Rollback & BLE Bridge)
[env:esp32_node_t_ota]
extends = env:esp32_node_t
board_build.partitions = min_spiffs.csv
build_flags =
    ${env:esp32_node_t.build_flags}
    -DOPENNEAR_ENABLE_OTA=1
    -DOPENNEAR_ENABLE_BLE_GW=1
    -DOPENNEAR_LEADERLESS_BOOT=1
    -DOPENNEAR_FW_VERSION=0x00060000u

; v6.0 Universal IoT Mesh Gateway (Leaderless + Multi-Hop Mesh + MQTT/HA Discovery + Wi-Fi + BLE + OTA)
[env:esp32_iot_mesh_gw]
extends = env:esp32_gw_wifi_ble
build_flags =
    ${env:esp32_gw_wifi_ble.build_flags}
    -DOPENNEAR_LEADERLESS_BOOT=1
    -DOPENNEAR_FW_VERSION=0x00060400u

; v6.4 Optional MQTTS / HTTPS TLS Cloud Gateway (adds WiFiClientSecure + NVS Root CA PEM)
[env:esp32_iot_mesh_gw_tls]
extends = env:esp32_iot_mesh_gw
build_flags =
    ${env:esp32_iot_mesh_gw.build_flags}
    -DOPENNEAR_ENABLE_TLS=1

; Same master as lookahead; only the terminal's action clock changes.
[env:esp32_node_t_act_clock]
extends = env:esp32_node_t_lookahead
build_flags =
    ${env:esp32_node_t_lookahead.build_flags}
    -DOPENNEAR_ACT_CLOCK_BIAS_US=750
