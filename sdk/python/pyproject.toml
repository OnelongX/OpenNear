[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opennear"
version = "7.3.0"
description = "Zero-dependency Python SDK for OpenNear wireless mesh gateways (sub-ms TDMA sync, 2D indoor positioning, geofences, Wi-Fi CSI radar, and N-gateway HA)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "OpenNear Contributors" }
]
keywords = ["opennear", "iot", "esp32", "mesh", "tdma", "csi", "geofence", "indoor-positioning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/OnelongX/OpenNear"
Repository = "https://github.com/OnelongX/OpenNear"

[tool.setuptools.packages.find]
where = ["."]
include = ["opennear*"]
